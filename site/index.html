<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coursera学習スケジュール - Meta フロントエンド開発</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lock Screen -->
  <div class="lock-screen" id="lock-screen">
    <div class="lock-screen__card">
      <div class="lock-screen__icon">&#128274;</div>
      <h1 class="lock-screen__title">Coursera 学習スケジュール</h1>
      <p class="lock-screen__subtitle" id="lock-subtitle">パスワードを入力してください</p>
      <div class="lock-screen__form" id="lock-form-login">
        <input type="password" class="lock-screen__input" id="lock-password" placeholder="パスワード" autocomplete="current-password">
        <button class="btn btn--primary lock-screen__btn" id="lock-submit">ロック解除</button>
      </div>
      <div class="lock-screen__form" id="lock-form-setup" style="display:none">
        <p class="lock-screen__hint">初回設定: このアプリを保護するパスワードを設定してください</p>
        <input type="password" class="lock-screen__input" id="setup-password" placeholder="パスワード（4文字以上）" autocomplete="new-password">
        <input type="password" class="lock-screen__input" id="setup-password-confirm" placeholder="パスワード（確認）" autocomplete="new-password">
        <button class="btn btn--primary lock-screen__btn" id="setup-submit">設定する</button>
      </div>
      <p class="lock-screen__error" id="lock-error"></p>
    </div>
  </div>

  <!-- App -->
  <div id="app" style="display:none">
  <header class="header">
    <div class="container header__row">
      <div>
        <h1 class="header__title">Coursera 学習スケジュール管理</h1>
        <p class="header__subtitle">Meta フロントエンド開発 プロフェッショナル認定</p>
      </div>
      <button class="btn btn--lock" id="lock-btn" title="ロック">&#128274; ロック</button>
    </div>
  </header>

  <main class="container">
    <section class="progress-overview" id="progress-overview">
      <h2>全体の進捗</h2>
      <div class="progress-bar-container">
        <div class="progress-bar" id="overall-progress-bar">
          <span class="progress-text" id="overall-progress-text">0%</span>
        </div>
      </div>
      <div class="stats">
        <div class="stat-card">
          <span class="stat-value" id="stat-completed">0</span>
          <span class="stat-label">完了コース</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-in-progress">0</span>
          <span class="stat-label">学習中</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-remaining">9</span>
          <span class="stat-label">未着手</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-total-weeks">0</span>
          <span class="stat-label">学習済み週数</span>
        </div>
      </div>
    </section>

    <section class="schedule-settings">
      <h2>スケジュール設定</h2>
      <div class="settings-form">
        <div class="form-group">
          <label for="start-date">学習開始日</label>
          <input type="date" id="start-date">
        </div>
        <div class="form-group">
          <label for="hours-per-week">週あたりの学習時間（時間）</label>
          <input type="number" id="hours-per-week" min="1" max="40" value="7">
        </div>
        <button class="btn btn--primary" id="generate-schedule">スケジュール生成</button>
      </div>
      <p class="schedule-estimate" id="schedule-estimate"></p>
    </section>

    <section class="course-list">
      <h2>コース一覧</h2>
      <div id="courses-container"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Coursera 学習スケジュール管理アプリ - Meta フロントエンド開発プロフェッショナル認定</p>
    </div>
  </footer>

  </div><!-- /app -->

  <script src="app.js"></script>
</body>
</html>
